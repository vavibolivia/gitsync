name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build solution
        run: dotnet build GitSync.sln -c Release
      - name: Integration tests (engine + server, real git over HTTP)
        run: dotnet test tests/GitSync.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Publish GitSync.exe
        run: >
          dotnet publish src/GitSync.Desktop/GitSync.Desktop.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o publish
      - name: Zip (for networks that block .exe downloads)
        run: Compress-Archive -Path publish/GitSync.exe -DestinationPath publish/GitSync-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GitSync-win-x64
          path: publish/GitSync.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/GitSync.exe
            publish/GitSync-win-x64.zip

